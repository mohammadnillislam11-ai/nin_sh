name: Build gemini-cli

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build ARM64 Executable
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Build with ndk-build
        run: |
          set -o pipefail
          echo "Starting ndk-build..."
          if ! ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk -j$(nproc) 2>&1 | tee build.log; then
            echo "=== NDK BUILD FAILED ==="
            grep -E "error:" build.log | head -n 30 | while read -r errline; do
              echo "::error title=NDK Error::$errline"
            done
            tail -n 120 build.log
            exit 1
          fi
          echo "Build finished. Packaging gemini-cli.sh wrapper..."
          ls -la libs/arm64-v8a/

          # Package standalone self-extracting in-memory runner .sh
          cat << 'EOF' > libs/arm64-v8a/gemini-cli.sh
#!/bin/sh
# ==============================================================================
# NINMODS Official In-Memory External Engine (gemini-cli.sh)
# ==============================================================================

if [ "$(id -u)" -ne 0 ]; then
    echo "[*] Requesting superuser privileges..."
    exec su -c "sh \"$0\" \"$@\""
fi

RAM_DIR=""
if [ -d "/dev/shm" ] && [ -w "/dev/shm" ]; then
    RAM_DIR="/dev/shm"
elif [ -d "/dev" ] && [ -w "/dev" ]; then
    RAM_DIR="/dev"
else
    RAM_DIR="/data/local/tmp"
fi

RUN_ID="$(date +%s)_$RANDOM"
MEM_BIN="$RAM_DIR/.gemini_proc_$RUN_ID"

# Extract embedded ARM64 binary payload from footer
PAYLOAD_LINE=$(awk '/^__PAYLOAD_BEGIN__/ {print NR + 1; exit 0; }' "$0")
tail -n+$PAYLOAD_LINE "$0" | base64 -d > "$MEM_BIN" 2>/dev/null
chmod 755 "$MEM_BIN" 2>/dev/null

# Execute directly into memory
"$MEM_BIN" "$@" &
PID=$!

# Fileless disarm: Remove temporary disk node while execution continues in RAM
sleep 0.4
rm -f "$MEM_BIN" 2>/dev/null

wait $PID 2>/dev/null
exit $?
__PAYLOAD_BEGIN__
EOF
          base64 libs/arm64-v8a/gemini-cli >> libs/arm64-v8a/gemini-cli.sh
          chmod 755 libs/arm64-v8a/gemini-cli.sh
          echo "gemini-cli.sh packaged successfully."
          ls -lh libs/arm64-v8a/gemini-cli.sh

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build.log

      - name: Upload External Mod Script (.sh)
        uses: actions/upload-artifact@v4
        with:
          name: gemini-cli-sh
          path: libs/arm64-v8a/gemini-cli.sh
          if-no-files-found: error

      - name: Upload Raw Binary
        uses: actions/upload-artifact@v4
        with:
          name: gemini-cli-arm64-v8a
          path: libs/arm64-v8a/gemini-cli
          if-no-files-found: error
